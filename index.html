<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Editor de motion graphics e publicidade digital que roda no navegador, sem servidor.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="estilo.css">
<title>Souza Motion Studio</title>
</head>
<body>
<noscript><p style="padding:24px;color:#fff">O Souza Motion Studio precisa de JavaScript ativado.</p></noscript>
<div id="boot" role="status">Carregando editor…</div>
<div id="app" data-m="layers" hidden>
  <header id="top">
    <div class="brand" title="Souza Motion Studio"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#ffd400"/><path d="M6 17V7l6 6 6-6v10" fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="bname">SOUZA <b>MOTION</b> STUDIO</span></div>
    <input id="projName" type="text" maxlength="80" aria-label="Nome do projeto" autocomplete="off">
    <div class="spacer"></div>
    <div class="tools" id="topTools"></div>
  </header>

  <aside id="dockL" data-tab="layers">
    <div class="tabs" id="tabsL"></div>
    <div class="panel" data-panel="layers" id="pLayers"></div>
    <div class="panel" data-panel="lib" id="pLib"></div>
  </aside>

  <main id="center">
    <div id="stageTools"></div>
    <div id="stageArea">
      <div id="rulerCorner"></div>
      <canvas id="rulerX" aria-hidden="true"></canvas>
      <canvas id="rulerY" aria-hidden="true"></canvas>
      <div id="viewport" tabindex="0" aria-label="Área de composição">
        <div id="stageWrap"><canvas id="stage"></canvas></div>
        <canvas id="overlay"></canvas>
        <div id="hud"></div>
        <button id="fsPlay" class="btn icon" hidden aria-label="Reproduzir ou pausar"></button>
      </div>
    </div>
  </main>

  <aside id="dockR" data-tab="props">
    <div class="tabs" id="tabsR"></div>
    <div class="panel" data-panel="props" id="pProps"></div>
    <div class="panel" data-panel="anim" id="pAnim"></div>
    <div class="panel" data-panel="scene" id="pScene"></div>
  </aside>

  <section id="transport"></section>
  <section id="tl" data-panel="timeline"><div id="tlResize" title="Arraste para ajustar a altura"></div><div id="tlScroll"><div id="tlInner"></div></div></section>
  <nav id="mnav" aria-label="Painéis"></nav>
</div>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>
<input id="filePick" type="file" hidden multiple>

<script src="config.js"></script>
<script src="banco.js"></script>
<script src="nucleo.js"></script>
<script src="animacao.js"></script>
<script src="icones.js"></script>
<script src="midia.js"></script>
<script src="audio.js"></script>
<script src="render.js"></script>
<script src="persistencia.js"></script>
<script src="exportar.js"></script>
<script src="templates.js"></script>
<script src="ui.js"></script>
<script src="comandos.js"></script>
<script src="palco.js"></script>
<script src="linha-tempo.js"></script>
<script src="propriedades.js"></script>
<script src="paineis.js"></script>
<script src="app.js"></script>
</body>
</html>
